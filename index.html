<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>잡아따</title>
    <meta name="description" content="기업이나 공고를 기준으로 이력서를 진단하고, 부족한 역량과 채우는 방법, 맞는 공고까지 한 리포트로 받아요." />
    <link rel="canonical" href="https://javadda.hidly.dev/" />
    <!-- 카카오톡, 디스코드, 슬랙 같은 곳에 링크를 붙였을 때 뜨는 미리보기 카드 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Javadda" />
    <meta property="og:title" content="Javadda, 나와 채용 공고 얼마나 적합할까요?" />
    <meta property="og:description" content="기업이나 공고를 기준으로 이력서를 진단하고, 부족한 역량과 채우는 방법, 맞는 공고까지 한 리포트로 받아요." />
    <meta property="og:url" content="https://javadda.hidly.dev/" />
    <meta property="og:image" content="https://javadda.hidly.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Javadda, 나와 채용 공고 얼마나 적합할까요?" />
    <meta name="twitter:description" content="기업이나 공고를 기준으로 이력서를 진단하고, 부족한 역량과 채우는 방법, 맞는 공고까지 한 리포트로 받아요." />
    <meta name="twitter:image" content="https://javadda.hidly.dev/og.png" />
    <!-- 예전 이름(whoisloafing:)으로 저장한 값을 javadda:로 한 번 옮겨요. 다른 코드가 읽기 전에 돌아야 해서 맨 앞에 둬요. -->
    <!-- 소개 화면은 두지 않아요. 브라우저의 메인 주소(/, /en, 예전 /about)로 들어오면 그리기 전에 바로 /app(새 진단 화면)으로 옮기고, 미리 그린 소개 화면은 숨겨요. -->
    <script>
      if (!/JavaddaApp\//.test(navigator.userAgent) && /^\/(?:en\/?)?(?:about\/?)?$/.test(location.pathname)) {
        history.replaceState(null, '', '/app' + location.search + location.hash)
        document.documentElement.dataset.shell = ''
      }
    </script>
    <style>html[data-shell] #root{display:none}</style>
    <script>
      try {
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i)
          if (k && k.indexOf('whoisloafing:') === 0) {
            var n = 'javadda:' + k.slice(13)
            if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k))
            localStorage.removeItem(k)
          }
        }
      } catch (e) {}
    </script>
    <!-- 앱 화면이 다크 모드면 자바스크립트를 받기 전에 dark를 붙이고 고른 메인 컬러(data-accent)를 붙여서, 밝은 화면이 잠깐 깜빡이지 않게 해요. 규칙은 src/lib/theme.ts와 같아요. -->
    <script>
      try {
        var p = location.pathname
        if (/JavaddaApp\//.test(navigator.userAgent) || /^\/(?:app|r|login|signup|me|history|diagnose|recommend|resume|company|explore|admin)(?=\/|$)/.test(p)) {
          var t = localStorage.getItem('javadda:app-theme')
          if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
          var a = localStorage.getItem('javadda:app-accent')
          if (a && a !== 'blue') document.documentElement.setAttribute('data-accent', a)
        }
        // 앱 2.8부터는 창 뒤에 macOS 사이드바 블러가 깔려서, 바탕을 비워 사이드바 자리에 블러가 보이게 해요(app.ts의 vibrancy와 같은 규칙).
        var v = /JavaddaApp\/(\d+)\.(\d+)/.exec(navigator.userAgent)
        if (v && (+v[1] > 2 || (+v[1] === 2 && +v[2] >= 8))) document.documentElement.setAttribute('data-vibrancy', '')
      } catch (e) {}
    </script>
    <style>html.dark{color-scheme:dark;background:#1c1c1e}html.dark[data-accent]{background:none}html[data-vibrancy],html[data-vibrancy] body{background:transparent}</style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
