<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>잡아따</title>
    <meta name="description" content="기업이나 공고를 기준으로 이력서를 진단하고, 부족한 역량과 채우는 방법, 맞는 공고까지 한 리포트로 받아요." />
    <link rel="canonical" href="https://javadda.hidly.dev/" />
    <!-- 카카오톡, 디스코드, 슬랙 같은 곳에 링크를 붙였을 때 뜨는 미리보기 카드 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Javadda" />
    <meta property="og:title" content="Javadda, 내 역량과 공고 사이 얼마나 멀까요?" />
    <meta property="og:description" content="기업이나 공고를 기준으로 이력서를 진단하고, 부족한 역량과 채우는 방법, 맞는 공고까지 한 리포트로 받아요." />
    <meta property="og:url" content="https://javadda.hidly.dev/" />
    <meta property="og:image" content="https://javadda.hidly.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Javadda, 내 역량과 공고 사이 얼마나 멀까요?" />
    <meta name="twitter:description" content="기업이나 공고를 기준으로 이력서를 진단하고, 부족한 역량과 채우는 방법, 맞는 공고까지 한 리포트로 받아요." />
    <meta name="twitter:image" content="https://javadda.hidly.dev/og.png" />
    <!-- 앱 화면이 다크 모드면 자바스크립트를 받기 전에 dark를 붙여서, 밝은 화면이 잠깐 깜빡이지 않게 해요. 규칙은 src/lib/theme.ts와 같아요. -->
    <script>
      try {
        var p = location.pathname
        if (/JavaddaApp\//.test(navigator.userAgent) || /^\/(?:app|r|login|signup|me|history|diagnose|recommend|resume|company|explore|admin)(?=\/|$)/.test(p)) {
          var t = localStorage.getItem('whoisloafing:app-theme')
          if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <style>html.dark{color-scheme:dark;background:#1c1c1e}</style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
